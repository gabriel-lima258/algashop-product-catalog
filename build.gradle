plugins {
    id 'java'
    id 'maven-publish'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.cloud.contract' version '5.0.0'
    // Plugin que processa arquivos .adoc e gera HTML, PDF, etc.
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
}


group = 'com.algaworks.algashop'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
    mavenLocal()
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact bootJar
            artifact verifierStubsJar
        }
    }
}

ext {
	set('springCloudVersion', "2025.1.0")
    // snippetsDir: diretório onde os testes depositam os fragmentos .adoc gerados.
    // Este caminho é passado para a task 'asciidoctor' como atributo '{snippets}',
    // que é então referenciado nos arquivos .adoc com: include::{snippets}/...
    set('snippetsDir', file("build/generated-snippets"))
    set('springCloudAwsVersion', "4.0.0")
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    // asciidoctorExt: escopo especial para a integração Spring REST Docs + AsciiDoc.
    // A dependência 'spring-restdocs-asciidoctor' neste escopo habilita o processamento
    // das diretivas operation::[] nos arquivos .adoc (alternativa às include:: manuais).
    asciidoctorExt
    // mockitoAgent: escopo só para resolver o JAR do Mockito e passá-lo como -javaagent.
    // A partir do JDK 21 o "self-attach" de agente é desencorajado (e no 24 falha), então
    // o Mockito precisa ser carregado explicitamente como agente na JVM de teste.
    // transitive = false: queremos o JAR do mockito-core sozinho, não a árvore de dependências.
    mockitoAgent {transitive = false}
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.modelmapper:modelmapper:3.2.6'
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.1'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-io:commons-io:2.21.0' // dependencia para extrair type dos arquivos
    implementation platform("io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}") // cloud aws
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client' // self client eureka
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3' // s3 bucket
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-parameter-store'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mongodb'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'io.rest-assured:spring-mock-mvc:6.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    mockitoAgent 'org.mockito:mockito-core'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

contracts {
    packageWithBaseClasses = "com.algaworks.algashop.product.catalog.contract.base"
}

// Três suítes separadas, uma por tipo de teste:
//   test            -> unitários e de fatia, rodam sozinhos (é o que roda no dia a dia)
//   contractTest    -> gerados pelo Spring Cloud Contract a partir dos .groovy
//   integrationTest -> classes *IT, exigem infraestrutura de pé (Mongo)
// 'check' amarra as três, então ./gradlew check (ou build) valida tudo de uma vez.
tasks.named('check') {
    dependsOn(test, contractTest, integrationTest)
}

tasks.named('contractTest') {
    // Declara snippetsDir como saída desta task.
    // Isso informa ao Gradle que os arquivos em build/generated-snippets
    // são produzidos por contractTest — necessário para que a task 'asciidoctor'
    // (que os consome como entrada) saiba quando precisa reprocessar.
    outputs.dir snippetsDir
	useJUnitPlatform()
}

tasks.named('test') {
	useJUnitPlatform()
}

test {
    // tira os *IT daqui: ./gradlew test tem que passar sem nenhum container de pé
    filter {
        excludeTestsMatching("*IT")
    }
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

// Mesmo código-fonte de teste (src/test), separado só pelo sufixo da classe.
// Não precisa de source set próprio — o filtro por nome já resolve.
tasks.register('integrationTest', Test) {
    description = 'Run integration tests.'
    group = 'verification'
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"

    // reaproveita os .class e o classpath compilados pelo source set de teste
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    // ordem, não dependência: se as duas rodarem, os unitários vêm primeiro —
    // falha barata aparece antes de gastar tempo com a suíte que precisa de infra
    shouldRunAfter test

    useJUnitPlatform()

    testLogging {
        events "passed"
    }

    // o espelho do filtro do 'test': aqui só entram os *IT
    filter {
        includeTestsMatching "*IT"
        excludeTestsMatching "*Test"
    }
}

// Task 'asciidoctor': converte os arquivos .adoc em HTML (ou PDF, etc.)
asciidoctor {
    // Garante que os snippets existam antes de tentar incluí-los no .adoc.
    // Ordem de execução: contractTest → asciidoctor
    dependsOn contractTest

    // Declara snippetsDir como entrada desta task.
    // O Gradle usa isso para rastrear mudanças e decidir se reprocessa ou não.
    inputs.dir snippetsDir

    // Torna a variável '{snippets}' disponível dentro dos arquivos .adoc.
    // Uso no .adoc: include::{snippets}/ProductTest/validate_findProductByIdV1/http-request.adoc[]
    attributes 'snippets': snippetsDir

    // Processa apenas o index.adoc como ponto de entrada da documentação.
    // Outros .adoc podem ser incluídos via include:: dentro do index.adoc.
    // Para adicionar novas páginas, crie arquivos .adoc e inclua-os no index.adoc.
    sources {
        include 'index.adoc'
    }

    // Faz com que os caminhos relativos nos include:: sejam resolvidos a partir
    // do diretório do próprio arquivo .adoc (src/docs/asciidoc/).
    // Sem isso, includes relativos falhariam durante o build.
    baseDirFollowsSourceFile()

    // Diretório de saída do HTML gerado.
    // Abra build/docs/asciidoc/index.html no navegador para ver a documentação.
    outputDir = file("build/docs/asciidoc")
}

// customiza o nome do jar criado
// ATENCAO: este nome tem que casar com o JAR_NAME do Dockerfile - o ADD copia
// build/libs/$JAR_NAME, entao divergir aqui quebra o build da imagem.
bootJar {
    archiveFileName = 'product-catalog.jar'
}

// task para realizar o build da aplicação
tasks.register('dockerBuild', Exec) {
    description = 'Builds a multi-plataform Docker image using Buildx'
    group = 'build'
    dependsOn('bootJar')
    workingDir project.rootDir
    commandLine '/usr/local/bin/docker', 'buildx', 'build',
            '--platform', 'linux/arm64/v8,linux/amd64',
            '--tag', 'gabriel58221/product-catalog:dev',
            '--push',
            '.'
}
