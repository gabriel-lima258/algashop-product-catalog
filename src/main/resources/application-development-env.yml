# config.import traz os secrets e parameters da aws (LocalStack) para este arquivo env.
# O seed é feito pelo etc/aws/init.sh (parameters.csv / secrets.csv).

# ACKS (recebimento de evento):
#  0 — o producer não espera confirmação nenhuma. Escreveu no socket, considerou enviado.
#  1 — espera só o líder gravar no log local dele.
#  all — espera as réplicas em sincronia (min.insync.replicas) confirmarem antes do ack.
#  A relação com idempotence é a INVERSA do que parece: é o enable.idempotence=true que
#  exige acks=all (e ele é o default desde o Kafka 3.0) — acks=all sozinho não liga nada

spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/product-catalog/redis?prefix=catalog.secrets.redis.
      - aws-parameterstore:/config/algashop/product-catalog?prefix=catalog.params
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cache:
    type: redis
  mongodb:
    uri: ${catalog.params.mongodb.uri}
  data:
    redis:
      host: ${catalog.params.redis.host}
      port: ${catalog.params.redis.port}
      password: ${catalog.secrets.redis.password}
      database: ${catalog.params.redis.database}
      timeout: ${catalog.params.redis.timeout}
  cloud:
    aws:
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566 # em prod não precisa
      credentials:
        access-key: LSIAQAAAAAAVNCBMPNSG
        secret-key: test
      s3:
        enabled: true
        path-style-access-enabled: true # em prod não precisa, facilita o uso em local
  security: # apontamos o resource para authorization server para ter validação e busca de chave públicas
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${shared.params.auth-server-url} # url de authorization server
  kafka:
    bootstrap-servers: algashop-kafka-1:9092,algashop-kafka-2:9093,algashop-kafka-3:9094
    properties:
      spring.json.type.mapping: # customiza o type id do path completo com somente a referencia da classe
        ProductCatalog.ProductDelistedIntegrationEvent:com.algaworks.algashop.product.catalog.application.product.event.ProductDelistedIntegrationEvent,
        ProductCatalog.ProductListedIntegrationEvent:com.algaworks.algashop.product.catalog.application.product.event.ProductListedIntegrationEvent,
        ProductCatalog.ProductAddedIntegrationEvent:com.algaworks.algashop.product.catalog.application.product.event.ProductAddedIntegrationEvent,
        ProductCatalog.ProductPriceChangedV2IntegrationEvent:com.algaworks.algashop.product.catalog.application.product.event.ProductPriceChangedV2IntegrationEvent,
        ProductCatalog.ProductPlacedOnSaleIntegrationEvent:com.algaworks.algashop.product.catalog.application.product.event.ProductPlacedOnSaleIntegrationEvent,
        ProductCatalog.ProductRestockedIntegrationEvent:com.algaworks.algashop.product.catalog.application.product.event.ProductRestockedIntegrationEvent,
        ProductCatalog.ProductSoldOutIntegrationEvent:com.algaworks.algashop.product.catalog.application.product.event.ProductSoldOutIntegrationEvent,
        ProductCatalog.StockReservationConfirmedIntegrationEvent:com.algaworks.algashop.product.catalog.application.stock.event.StockReservationConfirmedIntegrationEvent,
        ProductCatalog.StockReservationRejectedIntegrationEvent:com.algaworks.algashop.product.catalog.application.stock.event.StockReservationRejectedIntegrationEvent,
        Ordering.OrderPaidIntegrationEvent:com.algaworks.algashop.product.catalog.application.order.event.OrderPaidIntegrationEvent
    #ponto inicial de conexão
    admin:
      fail-fast: true # Falha rápida caso não consiga se conectar ao cluster
      auto-create: true # Permite a criação automática de tópicos caso não existam
      modify-topic-configs: false # Impede a modificação de configurações de tópicos existentes
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # chave String
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer # valor Json
#      retries: 2147483647 # número maximo de tentativa
      properties:
        enable.idempotence: true
#        retry.backoff.ms: 100 # espera inicial entre uma tentativa e outra
#        retry.backoff.max.ms: 1000 # teto do backoff, que cresce a cada nova tentativa
        request.timeout.ms: 5000 # tempo de UMA ida ao broker esperando a resposta
        delivery.timeout.ms: 30000 # teto da operação inteira: envio + retries + backoff + confirmação
        max.block.ms: 5000 # tempo que o próprio send() pode bloquear antes de existir future
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        max.poll.interval.ms: 300000 # (5 min) tempo máximo entre chamadas de consumo de eventos
        max.poll.records: 1
        heartbeat.interval.ms: 3000
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.algaworks.algashop.* # define os pacotes seguros ao kafka para evitar erros
        spring.json.key.default.type: java.lang.String
        spring.json.value.default.type: java.lang.String
        spring.json.value.type.method: com.algaworks.algashop.product.catalog.infrastructure.kafka.KafkaConsumerTypeIdIdentifier.readType

logging:
  level:
    org.mongodb.driver.protocol.command: DEBUG
#    org.mongodb.driver.protocol.query: DEBUG
#    org.mongodb.driver.connection: DEBUG
    org.mongodb.driver.cluster: OFF
    com.netflix.discovery.DiscoveryClient: OFF # desativa error eureka em dev
    com.netflix.discovery: OFF
    com.netflix.eureka: OFF

algashop:
  data-load:
    enabled: ${catalog.params.data-load.enabled}
    auto-drop: ${catalog.params.data-load.auto-drop}
    sources:
      - location: db/testdata/categories.json
        collection: categories
      - location: db/testdata/products.json
        collection: products
  mapping:
    image-storage-url: ${catalog.params.mapping.image-storage-url}
  storage:
    s3:
      bucket-name: ${catalog.params.storage.s3.bucket-name}
  messaging:
    kafka:
      product-event-topic-name: product-catalog.product.events
      order-event-topic-name: ordering.order.events
      stock-event-topic-name: product-catalog.stock.events
      order-events-consumer-group: product-catalog.order-events
eureka:
  client:
    serviceUrl:
      defaultZone: ${shared.params.service-registry-url}/eureka
    healthcheck:
      enabled: true # habilita o health em eureka para status de serviço dentro de eureka
  instance:
    instanceId: ${random.uuid} # cada instancia replicada ganha um id unico
    prefer-ip-address: true # configura rede alcançável via docker
