# O que vale em qualquer ambiente de teste. A URI do Mongo NAO esta aqui de proposito -
# ela e a unica coisa que muda por ambiente, e mora no application-test-env.yaml.
#
# A carga fica ligada com auto-drop: true porque em teste isso deixa de ser perigoso e
# vira exatamente o que se quer - cada execucao comeca do mesmo estado conhecido. O
# QuantityInStockAdjustmentIT ainda chama dataLoader.run() no @BeforeEach, para isolar um
# cenario do outro dentro da mesma classe
server.port: 8083

spring:
  application:
    name: product-catalog
  data:
    mongodb:
      auto-index-creation: true
  # O starter do S3 esta no classpath, entao a autoconfiguracao do Spring Cloud AWS
  # tenta construir o bean s3Client na subida do contexto - independente de qual
  # StorageProvider esta ativo. Sem regiao ela procura em toda a cadeia de provedores
  # (variavel de ambiente, ~/.aws/config, metadata da instancia) e falha com
  # "Unable to load region from any of the providers in the chain", derrubando o
  # contexto inteiro de TODOS os *IT. Fixar aqui resolve sem rede nenhuma: o cliente
  # e preguicoso, construi-lo nao abre conexao.
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test

logging:
  level:
    org.mongodb.driver.protocol.command: DEBUG
    org.mongodb.driver.protocol.query: DEBUG
    org.mongodb.driver.connection: DEBUG

algashop:
  # Em teste o provider e o fake, nao o s3. Nenhum *IT deve depender de localstack de
  # pe para subir: o fake responde requestUploadUrl com URL de mentira e fileExists
  # com true (menos para "fail.jpg", que existe justamente para exercitar a rejeicao).
  # Sem esta linha vale o matchIfMissing = true do StorageProviderAwsS3Impl.
  storage:
    provider: fake
  # ApplicationMappingProperty e @Component incondicional com @Validated @NotBlank -
  # sem esta propriedade o contexto nao sobe em ambiente nenhum. O valor e so um
  # prefixo para montar a URL de leitura da imagem; nada e resolvido de fato.
  mapping:
    image-storage-url: http://localhost:4566/algashop-product-image
  data-load:
    enabled: true
    auto-drop: true
    sources:
      - location: db/testdata/categories.json
        collection: categories
      - location: db/testdata/products.json
        collection: products